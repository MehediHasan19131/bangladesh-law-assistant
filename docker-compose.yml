# docker compose up            -> app on http://localhost:8000, answering with a local Ollama model
# ANTHROPIC_API_KEY=... docker compose up   -> same app, answering with Claude
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:0.32.6
    volumes: [ollama:/root/.ollama]
    # pull the model on first start, then serve
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-gemma3:4b} && wait"]

volumes:
  ollama:
