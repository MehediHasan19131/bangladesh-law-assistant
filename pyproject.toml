[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangladesh-law-assistant"
version = "0.1.0"
description = "Bilingual RAG assistant that answers questions about Bangladeshi laws with section-level citations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mehedi Hasan" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "rank-bm25",
    "requests",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
